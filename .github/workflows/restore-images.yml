name: Restore prior photos (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prior photos from the old site
        run: |
          set -e
          B="https://img1.wsimg.com/isteam/ip/38df2a2b-acdb-45f7-add9-8faf30e61e7f"
          get() { curl -fsSL "$B/$1/:/rs=w:$3" -o "img/$2"; echo "$2 $(stat -c%s img/$2)"; }
          get "10.jpg" hero-burullus.jpg 2000
          get "DSC_1460(1).jpg" burullus-crew.jpg 1600
          get "DSC01667.JPG" bridge-underside.jpg 1400
          get "DSC01631.JPG" bridge-inspection.jpg 1600
          get "Waikiki%20Shell.jpg" waikiki-shell-model.jpg 1400
          get "DSC02714.JPG" bollard.jpg 1400
          get "DSC02085.JPG" blaisdell-railing.jpg 1400
          get "IMG_0624.JPG" candlewood.jpg 1400
          get "1%20-%20ALL%20gear%20-%20Copy.JPG" moorings.jpg 1400
          get "IMG_0630.JPG" lago-mar.jpg 1400
          get "IMG_6452.jpg" dock-install.jpg 1400
      - name: Remove renderings and photos no longer used
        run: |
          git rm -f --ignore-unmatch img/bigisland-1.jpg img/bigisland-2.jpg img/billabong-16.jpg img/billabong-18.jpg img/billabong-20.jpg img/billabong-24.jpg img/fan-support.jpg img/griffith-aerial.jpg img/griffith-pool.jpg img/griffith-rear.jpg img/machine-foundation.jpg img/metal-building.jpg img/pier-canopy-2.jpg img/pier-canopy.jpg img/sakamoto-aerial.jpg img/sakamoto-entry.jpg img/sakamoto-lanai.jpg img/sakamoto-rear.jpg img/suiter-aerial.jpg img/suiter-courtyard.jpg img/suiter-southeast.jpg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add img
          git commit -m "Restore prior project photos; remove renderings" || echo "nothing to commit"
          git push
