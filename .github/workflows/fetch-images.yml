name: Fetch site photos (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from the old site
        run: |
          set -e
          mkdir -p img
          B="https://img1.wsimg.com/isteam/ip/38df2a2b-acdb-45f7-add9-8faf30e61e7f"
          get() { curl -fsSL "$B/$1/:/rs=w:$3" -o "img/$2"; echo "$2 $(stat -c%s img/$2)"; }
          get "10.jpg" hero-burullus.jpg 2000
          get "DSC_1460(1).jpg" burullus-crew.jpg 1600
          get "DSC01667.JPG" bridge-underside.jpg 1400
          get "DSC01631.JPG" bridge-inspection.jpg 1600
          get "Waikiki%20Shell%20(2).JPG" waikiki-shell.jpg 1400
          get "Waikiki%20Shell.jpg" waikiki-shell-model.jpg 1400
          get "DSC02714.JPG" bollard.jpg 1400
          get "DSC02085.JPG" blaisdell-railing.jpg 1400
          get "IMG_0624.JPG" candlewood.jpg 1400
          get "1%20-%20ALL%20gear%20-%20Copy.JPG" moorings.jpg 1400
          get "kewalo.jpg" kewalo-docks.jpg 1600
          get "IMG_0630.JPG" lago-mar.jpg 1400
          get "IMG_20180518_174004302.jpg" residential.jpg 1400
          get "IMG_6452.jpg" dock-install.jpg 1400
          get "IMG_0620.JPG" underwater-inspection.jpg 1200
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add img
          git commit -m "Add site photos" || echo "nothing to commit"
          git push
